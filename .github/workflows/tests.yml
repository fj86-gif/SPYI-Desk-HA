name: Smoke test
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/smoke_test.py
      - run: pip install openpyxl==3.1.5
      - run: python tests/market_test.py
      - run: python tests/test_spdr_holdings_parser.py
      - run: python -m py_compile spyi_desk/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/history_return_test.js
