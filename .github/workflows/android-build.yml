name: Android compile check (unsigned)
on:
  push:
    paths:
      - 'android/**'
      - 'spyi_desk/SPYI_Dashboard.html'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile a non-debuggable unsigned release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SPYIDesk-UNSIGNED-NOT-INSTALLABLE
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
